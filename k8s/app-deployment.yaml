apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-inventarios-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-inventarios-api
  template:
    metadata:
      labels:
        app: gestion-inventarios-api
    spec:
      containers:
        - name: gestion-inventarios-api
          image: spring-boot-inventory-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-inventarios-api-service
spec:
  selector:
    app: gestion-inventarios-api
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort