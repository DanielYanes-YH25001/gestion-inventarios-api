spring.application.name=gestion-inventarios-api

# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_inventarios_api
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA con Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Opcional pero recomendado para aprender: imprime el SQL en consola
spring.jpa.show-sql=true